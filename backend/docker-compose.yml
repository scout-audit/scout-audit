version: '3.9'

services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: soroban_audit_prep
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Builds and runs the real production image (same Dockerfile Railway
  # uses) against the local Postgres above -- useful for testing the built
  # image before deploying. For day-to-day dev with hot reload, just run
  # `pnpm dev` on the host and `docker compose up postgres` for the DB.
  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "5000:5000"
    depends_on:
      - postgres
    env_file:
      - .env
    environment:
      - DB_HOST=postgres
      - NODE_ENV=production

volumes:
  postgres_data:
